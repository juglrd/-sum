<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>/SUM OSCARS</title><style>body{margin:0;background:#050505;color:#fff;font-family:Arial,sans-serif}main{max-width:1000px;margin:auto;padding:40px 20px}.btn{padding:12px 18px;background:#d8ad49;color:#050505;border:0;cursor:pointer}.notice{padding:14px;margin:15px 0;background:#171209;border:1px solid #4c3c17}.error{background:#190c0c;color:#e0a0a0}.success{background:#0e170b;color:#b8d99e}input{width:100%;padding:12px;background:#111;color:#fff;border:1px solid #333;box-sizing:border-box;margin:6px 0}.field{margin:18px 0}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.card{padding:20px;background:#101010;border:1px solid #292929}@media(max-width:700px){.grid{grid-template-columns:1fr}}</style></head><body><main><p>THE OFFICIAL SERVER AWARDS</p><h1>/SUM OSCARS</h1><p>The offical awards for people inside the server, nominate carefully and have fun.</p><div id="count"></div><h2>Categories</h2><div class="grid" id="cats"></div><h2 id="nominate">Nominations</h2><div id="status" class="notice">Checking the live awards server…</div><div id="formPanel" style="display:none"><form id="nomForm"><div class="field"><label>Your Discord Username</label><input id="submitter" required></div><div id="fields"></div><button class="btn" type="submit">Submit Nominations</button></form></div><h2>Round 2</h2><div id="roundStatus" class="notice">Finalists will appear here when revealed.</div><div id="roundGrid"></div></main><script>const API='https://script.google.com/macros/s/AKfycbzXQxKlvhDt1C0kNEGZNFOpzDjbU7JOLmun-w-fYDlJjexbqW9Yg5fMUt3ngs4bPOKl/exec';const C=['Most Valuable Member','Most Loyal Member','Most Funniest Member','Best Staff Member','Biggest Crashout','Best Duo','Best Profile','Best Friendgroup','Best Hater','Best Ragebaiter','Most Annoying','Best Looking Male','Best Looking Female'];const SELF=new Set(C.filter(x=>x!=='Best Friendgroup'));let state={categories:{},round2:false,round2Data:[]};const esc=s=>String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));function api(action,extra={}){return new Promise((resolve,reject)=>{const cb='sumcb'+Date.now()+Math.random().toString(36).slice(2),script=document.createElement('script');let done=false;const finish=(fn,v)=>{if(done)return;done=true;clearTimeout(timer);delete window[cb];script.remove();fn(v)};window[cb]=v=>finish(resolve,v);script.onerror=()=>finish(reject,new Error('The awards backend could not be reached.'));const timer=setTimeout(()=>finish(reject,new Error('The awards backend timed out.')),12000);script.src=API+'?'+new URLSearchParams({action,callback:cb,_:Date.now(),...extra});document.body.appendChild(script)})}function buildForm(){const f=document.getElementById('fields');f.innerHTML='';C.forEach((c,i)=>{if(!state.categories[c]?.open)return;let h='<div class="field"><label>'+esc(c)+'</label>';if(c==='Best Duo'){h+='<input name="'+i+'a" required placeholder="First person"><input name="'+i+'b" required placeholder="Second person">'}else if(c==='Best Friendgroup'){h+='<input name="'+i+'" placeholder="Friend group name (optional)">'}else{h+='<input name="'+i+'" required placeholder="Discord username">';if(SELF.has(c))h+='<label><input type="checkbox" data-self="'+i+'" style="width:auto"> Submit Yourself</label>'}h+='</div>';f.insertAdjacentHTML('beforeend',h)});document.querySelectorAll('[data-self]').forEach(x=>x.onchange=()=>{const i=x.dataset.self;document.querySelector('[name="'+i+'"]' ).value=x.checked?document.getElementById('submitter').value:''})}function render(){const open=C.filter(c=>state.categories[c]?.open);document.getElementById('status').className='notice '+(open.length?'success':'');document.getElementById('status').textContent=open.length?'Nominations are open for '+open.length+' categories.':'Nominations are currently closed.';document.getElementById('formPanel').style.display=open.length?'block':'none';if(open.length)buildForm();document.getElementById('roundStatus').className='notice '+(state.round2?'success':'');document.getElementById('roundStatus').textContent=state.round2?'Round 2 is LIVE — vote for one finalist in each category.':'Finalists will appear here when revealed.';document.getElementById('roundGrid').innerHTML=state.round2?state.round2Data.map(x=>'<div class="card"><b>'+esc(x.category)+'</b><p>'+esc(x.name)+'</p><p>'+Number(x.votes||0)+' votes</p><button class="btn" onclick="vote('+JSON.stringify(x.category)+','+JSON.stringify(x.name)+')">Vote</button></div>').join(''):''}async function refresh(){try{const r=await api('state');if(!r.ok)throw new Error(r.error||'Backend returned an error.');state=r;render()}catch(e){const x=document.getElementById('status');x.className='notice error';x.textContent='Backend connection failed: '+e.message+' — please try again in a moment.'}}document.getElementById('nomForm').addEventListener('submit',async e=>{e.preventDefault();const f=new FormData(e.target),data={};C.forEach((c,i)=>{if(!state.categories[c]?.open)return;if(c==='Best Duo')data[c]=[f.get(i+'a'),f.get(i+'b')];else data[c]=f.get(String(i))||''});const missing=C.filter(c=>state.categories[c]?.open&&c!=='Best Friendgroup'&&(!data[c]||(Array.isArray(data[c])&&data[c].some(v=>!String(v||'').trim()))));if(missing.length)return alert('Please complete: '+missing.join(', '));const submitter=document.getElementById('submitter').value.trim();if(!submitter)return alert('Enter your Discord username.');try{const r=await api('submit',{submitter,data:JSON.stringify(data)});if(!r.ok)throw new Error(r.error||'Submission failed.');e.target.reset();alert('Nomination submitted successfully.')}catch(err){alert('Could not submit: '+err.message)}});async function vote(category,name){const voter=localStorage.getItem('sumVoter')||prompt('Enter your Discord username to vote:');if(!voter)return;localStorage.setItem('sumVoter',voter);try{const r=await api('vote',{category,name,voter});if(!r.ok)throw new Error(r.error||'Vote failed.');state=r;render();alert('Vote recorded.')}catch(e){alert(e.message)}}C.forEach((c,i)=>document.getElementById('cats').insertAdjacentHTML('beforeend','<div class="card"><small>0'+(i+1)+'</small><h3>'+esc(c)+'</h3></div>'));const target=new Date('2026-08-21T23:59:59+01:00');function tick(){const n=Math.max(0,target-new Date()),s=Math.floor(n/1000);document.getElementById('count').textContent=Math.floor(s/86400)+'d '+Math.floor(s%86400/3600)+'h '+Math.floor(s%3600/60)+'m '+s%60+'s'}tick();setInterval(tick,1000);refresh();setInterval(refresh,30000);</script></body></html>
