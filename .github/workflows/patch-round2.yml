name: Patch Round 2 UI
on:
  push:
    paths:
      - '.github/workflows/patch-round2.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch Round 2 finalist saving
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          # Backend: let the authenticated admin receive the saved finalists even while Round 2 is closed.
          p=Path('apps-script/Code.gs')
          s=p.read_text()
          old="""saveState_(s);const r=publicState_(s);return p.callback?jsonp_(r,p.callback):out_(r)}catch(err)"""
          new="""saveState_(s);const r=publicState_(s);if(a==='setFinalists'){CATEGORIES.forEach(n=>{r.categories[n].finalists=s.categories[n].finalists});}return p.callback?jsonp_(r,p.callback):out_(r)}catch(err)"""
          if old not in s:
              raise SystemExit('Could not find backend response block')
          s=s.replace(old,new,1)
          p.write_text(s)

          # Frontend: ensure Save 4 Finalists sends exactly four unique finalists and keeps them after save.
          p=Path('index.html')
          s=p.read_text()
          start=s.find('function nomineeOptions(n,category){')
          end=s.find('async function setCategory', start)
          if start<0 or end<0:
              raise SystemExit('Could not find moderator finalist block')
          block=s[start:end]
          block=re.sub(r"async function saveFinalists\(category\).*?toast\('4 finalists saved ✓'\)\}", """async function saveFinalists(category){const ids=C.indexOf(category),vals=[0,1,2,3].map(i=>String(document.getElementById('fin_'+ids+'_'+i)?.value||'').trim());if(vals.some(v=>!v))return toast('Choose all 4 finalists.');if(new Set(vals.map(v=>v.toLowerCase())).size!==4)return toast('Each finalist must be different.');const data=vals.map(name=>({name,pic:'',votes:0}));const r=await api('setFinalists',{password:modPassword,category,data:JSON.stringify(data)});if(!r||!r.ok)return toast((r&&r.error)||'Could not save finalists.');if(r.categories&&r.categories[category])state=r;else{state.categories[category].finalists=data;}render();renderAdmin(await _adminApps());toast('4 finalists saved ✓')}""", block, flags=re.S)
          s=s[:start]+block+s[end:]
          p.write_text(s)
          PY
      - name: Commit patched files
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html apps-script/Code.gs
          git diff --cached --quiet && exit 0
          git commit -m "Fix Save 4 Finalists persistence"
          git push
